# ── General ──────────────────────────────────────

set -g mouse on
set -g history-limit 50000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -sg escape-time 10

# Terminal / color / clipboard
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB:clipboard'
set -g focus-events on
set -s set-clipboard on

# ── Copy Mode ────────────────────────────────────

setw -g mode-keys vi

bind -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-selection-and-cancel

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── Navigation ───────────────────────────────────

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; \
    display-message "Config reloaded"

# ── Status Bar ───────────────────────────────────

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Continuous slate background
set -g status-style 'bg=#303746,fg=#e6e6e6'

set -g status-left-length 40
set -g status-right-length 60

# Session name: green, slateblue
set -g status-left '#[fg=#39FF14,bg=#2a2f3a,bold] 󰆍 #S #[fg=#2a2f3a,bg=#303746,nobold]'

# No gaps between windows
setw -g window-status-separator ''

# Inactive windows
setw -g window-status-format \
    '#[fg=#e6e6e6,bg=#303746] #I #W '

# Active window: navy highlight
setw -g window-status-current-format \
    '#[fg=#303746,bg=#26324a]#[fg=#5FAFFF,bg=#26324a,bold] #I #W #[fg=#26324a,bg=#303746,nobold]'

# Right side: Tux + hostname, no duplicate clock
set -g status-right \
    '#[fg=#7f8ea3,bg=#303746]  #H '

# ── Pane Borders ─────────────────────────────────

set -g pane-border-style 'fg=#303746'
set -g pane-active-border-style 'fg=#5FAFFF'

# ── Messages / Copy Mode ────────────────────────

set -g message-style 'fg=#39FF14,bg=#2a2f3a'
set -g message-command-style 'fg=#e6e6e6,bg=#26324a'
set -g mode-style 'fg=#000000,bg=#5FAFFF'

# ── Activity Indicators ─────────────────────────

setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style 'fg=#FFD75F'
setw -g window-status-bell-style 'fg=#ff4628,bold'
