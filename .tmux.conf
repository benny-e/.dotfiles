set -g mouse on
set -g history-limit 50000

# Keep default tmux keybindings
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Better response time for Neovim
set -sg escape-time 10

# True color and terminal support
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-kitty:RGB:clipboard'
set -g focus-events on

set -s set-clipboard on
setw -g mode-keys vi

bind -T copy-mode-vi MouseDragEnd1Pane \
    send-keys -X copy-selection-and-cancel

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; \
    display-message "Config reloaded"


set -g status on
set -g status-position bottom
set -g status-interval 5

set -g status-style 'bg=#20252e,fg=#a0a8b5'

set -g status-left-length 30
set -g status-left '#[fg=#a8ffcf,bg=#225548,bold]  #S  #[default] '

set -g status-right-length 30
set -g status-right '#[fg=#b4c2d0,bg=#20252e] %H:%M  '

setw -g window-status-separator ''

setw -g window-status-format \
    '#[fg=#a0a8b5,bg=#20252e] #I #W '

setw -g window-status-current-format \
    '#[fg=#b9f7ff,bg=#205966,bold] #I #W #[default]'

set -g pane-border-style 'fg=#343b45'
set -g pane-active-border-style 'fg=#59c9cc'

set -g message-style 'fg=#ffffff,bg=#394452'
set -g message-command-style 'fg=#ffffff,bg=#394452'
