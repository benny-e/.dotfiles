# Minimal Hyprlock screen. An empty monitor matches every display.
general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    noise = 0.0
}

label {
    monitor =
    text = $TIME12
    color = rgb(ffffff)
    font_size = 76
    font_family = Noto Sans
    position = 0, 115
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    rounding = 12
    inner_color = rgba(15, 17, 22, 0.72)
    outer_color = rgba(255, 255, 255, 0.35)
    font_color = rgb(ffffff)
    font_family = Noto Sans
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -5
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] awk 'FNR == 1 {printf "Battery %d%%", $1; exit}' /sys/class/power_supply/BAT*/capacity
    color = rgb(d2d6de)
    font_size = 17
    font_family = Noto Sans
    position = 0, -82
    halign = center
    valign = center
}
